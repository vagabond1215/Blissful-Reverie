name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Package browser smoke snapshot
        run: tar -czf browser-smoke-snapshot.tgz index.html favicon.svg data scripts styles
      - uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-snapshot
          path: browser-smoke-snapshot.tgz
          retention-days: 1
