name: Validate

on:
  pull_request:
  push:
    branches:
      - main
      - codex/**

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Install browser acceptance runtime
        run: |
          npm install --no-save --package-lock=false playwright@1.55.0
          npx playwright install --with-deps chromium
      - name: Run browser acceptance batches
        run: |
          python3 -m http.server 4173 > /tmp/blissful-browser-server.log 2>&1 &
          SERVER_PID=$!
          trap 'kill "$SERVER_PID" 2>/dev/null || true' EXIT
          timeout 90s node tests/browser-family-dislikes.js
          timeout 90s node tests/browser-discovery-plan-shop.js
          timeout 180s node tests/browser-workspace-matrix.js
      - name: Package browser smoke snapshot
        run: tar -czf browser-smoke-snapshot.tgz index.html favicon.svg data scripts styles
      - uses: actions/upload-artifact@v4
        with:
          name: browser-smoke-snapshot
          path: browser-smoke-snapshot.tgz
          retention-days: 1
